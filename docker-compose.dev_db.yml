services:
  db:
    container_name: framedata_sql_db_dev
    restart: always
    image: postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 4080:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
